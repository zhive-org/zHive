name: Release @zhive/sdk

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - canary

concurrency:
  group: release-sdk
  cancel-in-progress: false

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/run-tests.yaml
    secrets: inherit

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      IS_CANARY: ${{ inputs.bump == 'canary' }}
    environment: npm-publish
    steps:
      - name: Validate branch
        run: |
          if [ "${{ inputs.bump }}" = "canary" ]; then
            if [ "${{ github.ref }}" != "refs/heads/canary" ]; then
              echo "::error::Canary releases must be run from the canary branch (got ${{ github.ref }})."
              exit 1
            fi
          else
            if [ "${{ github.ref }}" != "refs/heads/main" ]; then
              echo "::error::Stable releases must be run from the main branch (got ${{ github.ref }})."
              exit 1
            fi
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump version
        id: bump
        working-directory: apps/sdk
        run: |
          if [ "$IS_CANARY" = "true" ]; then
            pnpm version prerelease --preid=canary --no-git-tag-version
          else
            pnpm version ${{ inputs.bump }} --no-git-tag-version
          fi
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: pnpm build --filter=@zhive/sdk

      - name: Check tag collision
        run: |
          TAG="@zhive/sdk@${{ steps.bump.outputs.version }}"
          git fetch --tags
          if git tag -l "$TAG" | grep -q .; then
            echo "::error::Tag $TAG already exists. Version ${{ steps.bump.outputs.version }} was already released."
            echo "If the previous release failed partially, manually delete the tag and re-run."
            exit 1
          fi

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/sdk/package.json apps/sdk/src/objects.ts
          git commit -m "@zhive/sdk ${{ steps.bump.outputs.version }}"
          git tag "@zhive/sdk@${{ steps.bump.outputs.version }}"
          if [ "$IS_CANARY" = "true" ]; then
            BRANCH="canary"
          else
            BRANCH="main"
          fi
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
          git push origin "@zhive/sdk@${{ steps.bump.outputs.version }}"

      - name: Publish to npm
        working-directory: apps/sdk
        run: |
          if [ "$IS_CANARY" = "true" ]; then
            pnpm publish --tag canary --access public --no-git-checks
          else
            pnpm publish --access public --no-git-checks
          fi

      - name: Create GitHub Release
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep "^@zhive/sdk@" | sed -n '2p')
          if [ "$IS_CANARY" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          else
            PRERELEASE_FLAG=""
          fi
          if [ -n "$PREV_TAG" ]; then
            gh release create "@zhive/sdk@${{ steps.bump.outputs.version }}" \
              --title "@zhive/sdk v${{ steps.bump.outputs.version }}" \
              --notes-start-tag "$PREV_TAG" \
              --generate-notes \
              $PRERELEASE_FLAG
          else
            gh release create "@zhive/sdk@${{ steps.bump.outputs.version }}" \
              --title "@zhive/sdk v${{ steps.bump.outputs.version }}" \
              --generate-notes \
              $PRERELEASE_FLAG
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
